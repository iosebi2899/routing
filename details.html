<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Details</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <button id="back-btn">Go back to list</button>
    <div class="details-container">
      <h1 id="char-name"></h1>
      <img id="char-image" src="" alt="" />
      <p class="info">
        <span class="label">Status:</span> <span id="char-status"></span>
      </p>
      <p class="info">
        <span class="label">Species:</span> <span id="char-species"></span>
      </p>
      <p class="info">
        <span class="label">Gender:</span> <span id="char-gender"></span>
      </p>
      <p class="info">
        <span class="label">Origin:</span> <span id="char-origin"></span>
      </p>
    </div>

    <script src="scripts/details.js"></script>
  </body>
</html>
